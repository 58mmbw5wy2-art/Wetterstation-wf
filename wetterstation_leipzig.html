<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Wetterstation Leipzig</title>
<style>
html,body{margin:0;padding:0;background:#101d30;color:#fff;font-family:Arial,Helvetica,sans-serif}
body{padding:14px;box-sizing:border-box}
*{box-sizing:border-box}
.wrap{max-width:1050px;margin:0 auto}
.top{display:block;overflow:hidden;padding:5px 2px 14px}
.brand{font-size:18px;font-weight:bold;letter-spacing:2px;color:#b8d8f2}
.updated{font-size:12px;color:#9fb4ca;margin-top:5px}
.main{background:#1b3450;border-radius:18px;padding:22px;margin-bottom:12px;overflow:hidden}
.place{font-size:20px;color:#d9e9f7}
.now{overflow:hidden;margin-top:12px}
.temp{font-size:82px;line-height:1;font-weight:bold;float:left;margin-right:20px}
.summary{font-size:23px;padding-top:12px;color:#e9f3fb}
.feels{font-size:15px;color:#b8cce0;margin-top:8px}
.metrics{overflow:hidden;margin-top:22px;border-top:1px solid #45617c;padding-top:16px}
.metric{float:left;width:33.33%;padding:5px 8px 5px 0}
.metric b{display:block;font-size:22px}
.metric span{font-size:12px;color:#b8cce0}
.section{font-size:17px;font-weight:bold;margin:17px 2px 10px}
.days{overflow:hidden}
.day{float:left;width:20%;background:#1b3450;border-radius:12px;text-align:center;padding:13px 2px;margin-bottom:8px}
.dayname{font-size:13px;color:#c6d9eb}
.dayicon{font-size:27px;margin:9px 0}
.daytemp{font-size:17px;font-weight:bold}
.daylow{font-size:12px;color:#a9bfd4;margin-top:5px}
.hourly{background:#1b3450;border-radius:12px;padding:12px;overflow:hidden}
.hour{float:left;width:20%;text-align:center;padding:5px 0}
.hour span{display:block;font-size:12px;color:#c6d9eb}
.hour b{display:block;font-size:17px;margin:8px 0}
.hour em{font-style:normal;font-size:20px}
.footer{font-size:11px;color:#849bb2;text-align:center;padding:14px 0}
.error{color:#ffd18c;font-size:14px;padding:12px 2px}
@media (max-width:480px){.temp{font-size:65px}.summary{font-size:18px}.main{padding:16px}.metric b{font-size:18px}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">WETTERSTATION</div>
    <div class="updated" id="updated">Wetterdaten werden geladen …</div>
  </div>
  <div class="main">
    <div class="place">Leipzig</div>
    <div class="now">
      <div class="temp" id="temp">--°</div>
      <div class="summary" id="desc">Lade Wetter …</div>
      <div class="feels" id="feels">Gefühlt --° · Tageshöchstwert --°</div>
    </div>
    <div class="metrics">
      <div class="metric"><b id="humidity">--%</b><span>Luftfeuchtigkeit</span></div>
      <div class="metric"><b id="wind">-- km/h</b><span>Wind</span></div>
      <div class="metric"><b id="rain">--%</b><span>Regenrisiko</span></div>
    </div>
  </div>
  <div class="section">STUNDENÜBERSICHT</div>
  <div class="hourly" id="hours">
    <div class="hour"><span>--:--</span><em>…</em><b>--°</b></div>
  </div>
  <div class="section">DIE NÄCHSTEN 5 TAGE</div>
  <div class="days" id="days">
    <div class="day">Vorhersage wird geladen …</div>
  </div>
  <div class="error" id="error"></div>
  <div class="footer">Wetterdaten: Open-Meteo · Aktualisierung alle 30 Minuten</div>
</div>
<script type="text/javascript">
(function(){
var lat=51.3397, lon=12.3731;
var url="https://api.open-meteo.com/v1/forecast?latitude="+lat+"&longitude="+lon+
"&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,weather_code,wind_speed_10m"+
"&hourly=temperature_2m,precipitation_probability,weather_code"+
"&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max"+
"&forecast_days=5&timezone=Europe%2FBerlin&wind_speed_unit=kmh";
function icon(code,day){
 if(code===0)return day?"☀":"☾";
 if(code===1)return day?"🌤":"☁";
 if(code===2)return "⛅";
 if(code===3)return "☁";
 if(code===45||code===48)return "🌫";
 if(code>=51&&code<=67)return "🌧";
 if(code>=71&&code<=77)return "❄";
 if(code>=80&&code<=82)return "🌦";
 if(code>=85&&code<=86)return "🌨";
 if(code>=95)return "⛈";
 return "☁";
}
function desc(code){
 if(code===0)return "Klar";
 if(code===1)return "Überwiegend klar";
 if(code===2)return "Teilweise bewölkt";
 if(code===3)return "Bedeckt";
 if(code===45||code===48)return "Nebel";
 if(code>=51&&code<=57)return "Nieselregen";
 if(code>=61&&code<=67)return "Regen";
 if(code>=71&&code<=77)return "Schnee";
 if(code>=80&&code<=82)return "Regenschauer";
 if(code>=85&&code<=86)return "Schneeschauer";
 if(code>=95)return "Gewitter";
 return "Wetter";
}
function dayName(s,i){
 if(i===0)return "Heute";
 var d=new Date(s+"T12:00:00");
 var names=["So","Mo","Di","Mi","Do","Fr","Sa"];
 return names[d.getDay()];
}
function load(){
 var x=new XMLHttpRequest();
 x.open("GET",url,true);
 x.onreadystatechange=function(){
  if(x.readyState!==4)return;
  if(x.status<200||x.status>=300){
   document.getElementById("error").innerHTML="Wetterdaten gerade nicht erreichbar. Bitte Internetverbindung prüfen.";
   return;
  }
  try{
   var d=JSON.parse(x.responseText),c=d.current,day=d.daily;
   document.getElementById("temp").innerHTML=Math.round(c.temperature_2m)+"°";
   document.getElementById("desc").innerHTML=icon(c.weather_code,c.is_day===1)+" "+desc(c.weather_code);
   document.getElementById("feels").innerHTML="Gefühlt "+Math.round(c.apparent_temperature)+"° · Heute "+Math.round(day.temperature_2m_max[0])+"° / "+Math.round(day.temperature_2m_min[0])+"°";
   document.getElementById("humidity").innerHTML=Math.round(c.relative_humidity_2m)+"%";
   document.getElementById("wind").innerHTML=Math.round(c.wind_speed_10m)+" km/h";
   document.getElementById("rain").innerHTML=(d.hourly.precipitation_probability[0]||0)+"%";
   var now=new Date();
   document.getElementById("updated").innerHTML="Zuletzt aktualisiert: "+now.toLocaleDateString("de-DE")+" · "+now.toLocaleTimeString("de-DE",{hour:"2-digit",minute:"2-digit"});
   var h="",start=0;
   for(var j=0;j<d.hourly.time.length;j++){if(d.hourly.time[j].substring(11,13)===("0"+now.getHours()).slice(-2)){start=j;break;}}
   for(var k=0;k<5;k++){
    var n=start+k*3;if(n>=d.hourly.time.length)break;
    h+='<div class="hour"><span>'+d.hourly.time[n].substring(11,16)+'</span><em>'+icon(d.hourly.weather_code[n],1)+'</em><b>'+Math.round(d.hourly.temperature_2m[n])+'°</b><span>'+d.hourly.precipitation_probability[n]+'% Regen</span></div>';
   }
   document.getElementById("hours").innerHTML=h;
   var out="";
   for(var i=0;i<day.time.length;i++){
    out+='<div class="day"><div class="dayname">'+dayName(day.time[i],i)+'</div><div class="dayicon">'+icon(day.weather_code[i],1)+'</div><div class="daytemp">'+Math.round(day.temperature_2m_max[i])+'°</div><div class="daylow">'+Math.round(day.temperature_2m_min[i])+'° · '+day.precipitation_probability_max[i]+'%</div></div>';
   }
   document.getElementById("days").innerHTML=out;
   document.getElementById("error").innerHTML="";
  }catch(e){document.getElementById("error").innerHTML="Die Wetterdaten konnten nicht gelesen werden.";}
 };
 x.onerror=function(){document.getElementById("error").innerHTML="Keine Verbindung zum Wetterdienst.";};
 x.send(null);
}
load();
window.setInterval(load,1800000);
})();
</script>
</body>
</html>
